services:
  chatify-bot-server:
    image: chatify-bot-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatify-bot-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/chatify-firebase-service-account.json
    volumes:
      - /opt/chatify/secrets/chatify-6fdfb-firebase-adminsdk-pwlcz-3f90e6672e.json:/run/secrets/chatify-firebase-service-account.json:ro
    ports:
      - "127.0.0.1:3002:3000"

